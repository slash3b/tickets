# The fake bank's HTTP surface.
#
# Generated by hand from bank.go and models.go and kept next to them. If you change a
# handler or a struct tag, change this file in the same commit — a payment client written
# against a stale spec is exactly the failure this service exists to provoke.
#
# OpenAPI 3.1.1, the current release of the specification. 3.1 matters here rather than
# being fashion: its JSON Schema 2020-12 alignment is what lets `null`, `const` and the
# duration notes below be expressed honestly instead of approximated.
openapi: 3.1.1

info:
  title: bank
  version: 0.1.0
  summary: A deliberately adversarial fake payment processor.
  description: |
    This service is not a convenience. It exists to make the rest of the system suffer,
    and every unusual thing in this document is deliberate.

    THE ONE BEHAVIOUR THAT MATTERS — TIMEOUT WITH SIDE EFFECT. A configurable fraction of
    `POST /authorize` calls record the charge and then never answer at all. The connection
    simply hangs until the caller's own deadline fires. There is no status code for this,
    which is why you will not find it in the `responses` of that operation: from the wire's
    point of view nothing was returned, while server-side the money moved.

    A client that treats such a timeout as "the payment failed" will refuse a customer who
    has already been charged, or retry with a fresh key and charge them twice. The two
    mechanisms that make this survivable are both here:

      - `idempotency_key` on every authorize. A repeated key returns the ORIGINAL charge,
        verdict and all. The dice are never rolled twice for the same key.
      - `GET /charges/{key}`, the reconciliation path. After an unknown outcome, ask.
        A 404 is a definitive "this never happened, safe to retry".

    Derive the key from something stable, such as the order id. Never from a clock or a
    random value — a key that changes on retry is not an idempotency key.

    NOT A REAL BANK. No auth, no money, no PCI surface, in-memory only. Every charge is
    lost on restart, which also means a reconciliation lookup after a pod restart returns
    404 for a charge that "happened". That is accepted: this thing runs on a LAN cluster
    to generate realistic failure, not to hold value.
  license:
    name: MIT

servers:
  - url: http://bank.bank.svc.cluster.local
    description: In-cluster. What payments talks to (BANK_URL).
  - url: https://bank.tickets.lan
    description: Ingress, LAN-only. What you curl to cause an outage by hand.
  - url: http://localhost:8080
    description: Local run.

tags:
  - name: charges
    description: The request path. Only these are traced.
  - name: operator
    description: Chaos dials and probes. Not part of any request path.

paths:
  /authorize:
    post:
      operationId: authorize
      tags: [charges]
      summary: Charge once per idempotency key.
      description: |
        Rolls the dice configured in `/config` and returns a verdict — or, with probability
        `timeout_rate`, records the charge and never replies.

        The ordering inside the handler is the whole point and is worth stating explicitly:
        the charge is written to the store FIRST, and only then does the service decide
        whether to answer. This is how a real processor behaves when the network drops
        after it has committed.

        A repeat of a known key short-circuits everything: no latency, no dice, no outage
        check. It returns the stored charge, so a retry can never turn an authorization
        into a decline.

        Note that a `declined` verdict is a 200, not an error status. It is a definite
        answer from a healthy bank, and the only definite "no" in this API. Every non-200
        and every timeout means UNKNOWN, and unknown must be reconciled rather than
        assumed failed.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthorizeRequest'}
            examples:
              order:
                summary: Key derived from an order id, as it should be
                value: {idempotency_key: order_01H8XK4_pay, amount_minor: 4250}
      responses:
        '200':
          description: |
            A verdict — `authorized` or `declined`. Also the response to a repeated key,
            in which case it is the original charge and may be older than this request.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Charge'}
              examples:
                authorized:
                  value:
                    id: ch_20260906_1
                    idempotency_key: order_01H8XK4_pay
                    amount_minor: 4250
                    status: authorized
                    created_at: '2026-09-06T10:12:41.502Z'
                declined:
                  value:
                    id: ch_20260906_2
                    idempotency_key: order_01H8XK5_pay
                    amount_minor: 4250
                    status: declined
                    decline_code: insufficient_funds
                    created_at: '2026-09-06T10:12:41.771Z'
        '400':
          description: |
            `idempotency_key` missing, or the body is not JSON. Nothing was recorded — this
            is one of the few definite negatives here.
          content:
            text/plain:
              schema: {type: string}
              example: idempotency_key and amount_minor are required
        '503':
          $ref: '#/components/responses/Outage'

  /charges/{key}:
    get:
      operationId: lookupCharge
      tags: [charges]
      summary: Ask what actually happened.
      description: |
        The recovery path for an unknown outcome, and the reason a timeout here is
        survivable at all. Looks up by idempotency key, not by charge id — after a timeout
        the key is the only identifier the caller has.

        Not affected by `outage` or by the latency dial: reconciliation has to keep working
        while the bank is refusing to authorize, otherwise an outage strands every payment
        that was in flight when it began.
      parameters:
        - name: key
          in: path
          required: true
          description: The `idempotency_key` sent to `/authorize`.
          schema: {type: string, minLength: 1}
          example: order_01H8XK4_pay
      responses:
        '200':
          description: The charge exists. This is what really happened, timeout or not.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Charge'}
        '404':
          description: |
            No charge under that key. Definitive: the money did not move, and the caller
            may safely retry with the same key.

            The in-memory store makes this a lie across a restart. See the caveat in the
            service description.
          content:
            text/plain:
              schema: {type: string}
              example: no such charge

  /config:
    get:
      operationId: getConfig
      tags: [operator]
      summary: Report the settings currently in force.
      description: |
        Exists so the operator page stops lying. Its sliders were write-only and rendered
        their hardcoded defaults after a reload, so the page could show a tame 5% while
        the bank was declining everything. A control that reports a number it never read
        is worse than no control.
      responses:
        '200':
          description: The live config.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Config'}
    put:
      operationId: setConfig
      tags: [operator]
      summary: Change the chaos dials. Merges, never replaces.
      description: |
        Absent fields keep their current values. This is load-bearing, not politeness: the
        operator page sends only `decline_rate` and `timeout_rate`, and when this handler
        replaced the whole config, every nudge of a slider silently zeroed `min_latency`
        and `max_latency` — deleting the 20-300ms the service exists to simulate. Nothing
        errored; payments just quietly became instant, which is the least realistic thing
        this service can do and the hardest to notice.

        Sending an explicit `0` still sets zero. Only omission preserves.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfigPatch'}
            examples:
              slider:
                summary: What the operator page sends — two fields, nothing else
                value: {decline_rate: 0.5, timeout_rate: 0.2}
              outage:
                summary: Take the bank down to watch backpressure
                value: {outage: true}
              savage:
                summary: A deliberately awful afternoon
                value: {min_latency: 500000000, max_latency: 5000000000, decline_rate: 0.3, timeout_rate: 0.25}
      responses:
        '204':
          description: Applied. Takes effect on the next authorize; in-flight calls are unaffected.
        '400':
          description: Body is not JSON, or a field has the wrong type.
          content:
            text/plain:
              schema: {type: string}
              example: bad config

  /healthz:
    get:
      operationId: healthz
      tags: [operator]
      summary: Liveness, served by the bank handler itself.
      description: |
        Always 200 if the process can route a request. Kubernetes uses `/livez` and
        `/readyz` below instead; this one predates them and is kept for curl and for
        anything already pointed at it.
      responses:
        '200': {description: Alive.}

  /livez:
    get:
      operationId: livez
      tags: [operator]
      summary: Kubernetes liveness probe.
      description: |
        Served by pkg/health on the outer mux, not by the bank handler — present on the
        running service, absent from `bank.Handler()` in tests.

        Failing this makes kubelet RESTART the container, so it checks nothing but whether
        the process is answering. It must never depend on a dependency: that turns a brief
        blip into an endless restart loop across every pod.
      responses:
        '200': {description: Alive.}

  /readyz:
    get:
      operationId: readyz
      tags: [operator]
      summary: Kubernetes readiness probe.
      description: |
        Also from pkg/health. Failing it removes the pod from Service endpoints but leaves
        it running. The bank registers no readiness checks — it has no dependencies — so
        this reports ready as soon as the poll loop has run once.

        It does NOT go unready during a configured `outage`. An outage is simulated bank
        behaviour, and hiding the pod would remove the very traffic the experiment needs.
      responses:
        '200': {description: Ready.}
        '503': {description: Not ready. For this service, only during the first moments after start.}

components:
  responses:
    Outage:
      description: |
        `outage` is set. The bank is refusing everything on purpose.

        Treat this as UNKNOWN rather than as a failure. It happens to be safe here — the
        outage check runs before anything is recorded — but a client must not learn to read
        5xx as "definitely did not happen", because for a real processor it does not.
      content:
        text/plain:
          schema: {type: string}
          example: bank is down

  schemas:
    Status:
      type: string
      description: |
        The verdict. There is deliberately no `pending`: this bank either answers with a
        decision or does not answer at all, and the second case is a timeout, not a state.
      enum: [authorized, declined]

    AuthorizeRequest:
      type: object
      required: [idempotency_key, amount_minor]
      properties:
        idempotency_key:
          type: string
          minLength: 1
          description: |
            Stable per logical payment. Derive it from the order id. A key that changes on
            retry is not an idempotency key, and defeats the only protection there is.
          example: order_01H8XK4_pay
        amount_minor:
          type: integer
          format: int64
          description: |
            Minor units — cents, not euros. Money is never a float. The bank does not check
            this against anything; a decline is dice, not arithmetic.
          example: 4250
      additionalProperties: false

    Charge:
      type: object
      description: |
        The record of one authorization attempt, keyed by `idempotency_key`. Immutable once
        written: a repeated key returns this same object rather than producing a second
        verdict.
      required: [id, idempotency_key, amount_minor, status, created_at]
      properties:
        id:
          type: string
          description: |
            Bank-assigned, shaped `ch_<yyyymmdd>_<n>`. The counter is per process and
            resets on restart, so it is unique within a run and not beyond it. Never use
            it as a key for anything — that is what `idempotency_key` is for.
          pattern: '^ch_[0-9]{8}_[0-9]+$'
          example: ch_20260906_1
        idempotency_key:
          type: string
          description: Echoed back, so a reconciliation response identifies itself.
          example: order_01H8XK4_pay
        amount_minor: {type: integer, format: int64, example: 4250}
        status: {$ref: '#/components/schemas/Status'}
        decline_code:
          type: string
          description: |
            Present only when `status` is `declined`. Currently always
            `insufficient_funds` — the bank has one reason and no imagination.
          example: insufficient_funds
        created_at:
          type: string
          format: date-time
          description: |
            RFC 3339, server clock. When the charge was RECORDED, which for a timed-out
            request is before the caller ever gave up.
          example: '2026-09-06T10:12:41.502Z'

    Duration:
      type: integer
      format: int64
      minimum: 0
      description: |
        NANOSECONDS. This is Go's `time.Duration` over JSON, which serialises as a plain
        integer count of nanoseconds with no unit anywhere on the wire.

        It is the one genuine trap in this API: `300` here is 300ns, not 300ms, and the
        difference between a realistic bank and an instant one is three orders of
        magnitude that nothing will warn you about. 300ms is `300000000`.

    Config:
      type: object
      description: The chaos dial, as reported by `GET /config`.
      required: [min_latency, max_latency, decline_rate, timeout_rate, outage]
      properties:
        min_latency:
          allOf: [{$ref: '#/components/schemas/Duration'}]
          description: Floor on artificial latency. Default 20ms.
          default: 20000000
        max_latency:
          allOf: [{$ref: '#/components/schemas/Duration'}]
          description: |
            Ceiling. Each authorize sleeps uniformly in `[min, max)`. If this is at or
            below `min_latency`, every request sleeps exactly `min_latency`.
          default: 300000000
        decline_rate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          default: 0.05
          description: Fraction of fresh charges that come back `declined`.
        timeout_rate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          default: 0.01
          description: |
            Fraction of fresh charges that are RECORDED AS AUTHORIZED OR DECLINED and then
            never answered. Not "fail" — succeed, silently. Rolled independently of, and
            after, `decline_rate`, so a timed-out charge may hold either verdict.

            Set it to 1 to make every new payment hang; existing keys still answer
            instantly from the store, which is what makes reconciliation testable.
          example: 0.01
        outage:
          type: boolean
          default: false
          description: |
            Refuse `/authorize` with 503 without recording anything. `/charges/{key}` keeps
            working, deliberately. For watching backpressure and queue growth upstream.

    ConfigPatch:
      type: object
      description: |
        The request body of `PUT /config`. Every field optional; omitted fields keep their
        current value. Structurally the same as `Config` with nothing required — kept as a
        separate schema so that "absent means unchanged" is stated by the type rather than
        only by prose.
      properties:
        min_latency: {$ref: '#/components/schemas/Duration'}
        max_latency: {$ref: '#/components/schemas/Duration'}
        decline_rate: {type: number, format: double, minimum: 0, maximum: 1}
        timeout_rate: {type: number, format: double, minimum: 0, maximum: 1}
        outage: {type: boolean}
