# Build every service, push to ghcr, then write the new tags back into deploy/ so
# Argo CD rolls them out.
#
# NO MATRIX, deliberately. A matrix ran one job per service, and every job pushed
# its own tag-bump commit at the same moment — so all but one were rejected
# non-fast-forward. That failed in the worst possible way: the image was built and
# pushed, but deploy/ still pointed at the old tag, and because the manifest said
# :latest the service deployed anyway and reported Healthy. bank silently ran a
# stale image for half an hour that way on 2026-08-27.
#
# One job means one push, so the race cannot happen at all. It also means services
# are discovered rather than listed, so adding one needs no change to this file.
# The cost is serial builds; for small Go binaries with a warm cache that is
# seconds, and a single failure stopping the lot is the behaviour you want anyway.
name: build

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'pkg/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    # A real Postgres, so the store tests run here instead of skipping.
    # The oversell test is NOT run in CI — it carries a build tag and is triggered
    # by hand with `make oversell`. It fires a thousand concurrent goroutines at a
    # database; that belongs in a decision to run it, not in every push.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tickets
          POSTGRES_PASSWORD: tickets
          POSTGRES_DB: tickets
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tickets"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://tickets:tickets@127.0.0.1:5432/tickets?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25', cache: true}
      - run: go vet ./...
      - run: go test -race -shuffle=on -timeout=2m ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to push the tag-bump commit
      packages: write   # to push to ghcr.io
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # built in; nothing to configure

      - name: Install kustomize
        run: |
          curl -sSLo /tmp/k.tar.gz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar -xzf /tmp/k.tar.gz -C /usr/local/bin

      - name: Build, push and pin every service
        run: |
          set -euo pipefail
          SHA=${{ github.sha }}

          # Services are whatever has a main package. Adding one needs no edit here.
          for dir in services/*/cmd; do
            svc=$(basename "$(dirname "$dir")")
            image=ghcr.io/${{ github.repository_owner }}/tickets-$svc

            echo "::group::$svc"
            docker buildx build \
              --build-arg SERVICE="$svc" \
              --build-arg VERSION="$SHA" \
              --tag "$image:$SHA" \
              --tag "$image:latest" \
              --cache-from type=gha,scope=$svc \
              --cache-to   type=gha,scope=$svc,mode=max \
              --push .

            # Pin the tag in the manifest, if this service is deployed at all.
            if [ -f "deploy/apps/$svc/kustomization.yaml" ]; then
              (cd "deploy/apps/$svc" && kustomize edit set image "$image:$SHA")
              echo "pinned $svc -> $SHA"
            else
              echo "$svc has no deploy/apps entry; image pushed, nothing to pin"
            fi
            echo "::endgroup::"
          done

      - name: Commit the pins
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/
          if git diff --staged --quiet; then
            echo "tags already current"
            exit 0
          fi
          git commit -m "deploy: $SHA [skip ci]" -m "$(git diff --staged --name-only)"
          # One job means one pusher, so a rejection here can only come from a
          # human pushing at the same moment. Rebase once and try again.
          git push || { git pull --rebase origin main && git push; }
        env:
          SHA: ${{ github.sha }}
