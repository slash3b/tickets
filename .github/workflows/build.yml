# Build every service, push to ghcr, then write the new tags back into deploy/ so
# Argo CD rolls them out.
#
# NO MATRIX, deliberately. A matrix ran one job per service, and every job pushed
# its own tag-bump commit at the same moment — so all but one were rejected
# non-fast-forward. That failed in the worst possible way: the image was built and
# pushed, but deploy/ still pointed at the old tag, and because the manifest said
# :latest the service deployed anyway and reported Healthy. bank silently ran a
# stale image for half an hour that way on 2026-08-27.
#
# One job means one push, so the race cannot happen at all. It also means services
# are discovered rather than listed, so adding one needs no change to this file.
# The cost is serial builds; for small Go binaries with a warm cache that is
# seconds, and a single failure stopping the lot is the behaviour you want anyway.
name: build

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'pkg/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'web/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    # A real Postgres, so the store tests run here instead of skipping.
    # The oversell test is NOT run in CI — it carries a build tag and is triggered
    # by hand with `make oversell`. It fires a thousand concurrent goroutines at a
    # database; that belongs in a decision to run it, not in every push.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tickets
          POSTGRES_PASSWORD: tickets
          POSTGRES_DB: tickets
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tickets"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://tickets:tickets@127.0.0.1:5432/tickets?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25', cache: true}
      # Five files had drifted out of gofmt and nothing noticed, because vet does
      # not check formatting. Cheap to gate, annoying to clean up in bulk later.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^tpl/' || true)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi
      - run: go vet ./...
      # -p 1 serialises packages: several share one database and truncate it on
      # setup, so running them concurrently makes one package delete another's
      # fixtures. See the note in the makefile.
      - run: go test -race -shuffle=on -p 1 -timeout=3m ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to push the tag-bump commit
      packages: write   # to push to ghcr.io
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # built in; nothing to configure

      - name: Install kustomize
        run: |
          curl -sSLo /tmp/k.tar.gz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar -xzf /tmp/k.tar.gz -C /usr/local/bin

      - name: Build, push and pin every service
        run: |
          set -euo pipefail
          SHA=${{ github.sha }}
          OWNER=${{ github.repository_owner }}

          # PIN BY IMAGE NAME, NOT BY DIRECTORY NAME.
          #
          # This used to look for deploy/apps/$svc/kustomization.yaml, which only
          # works when a service happens to have a kustomization named after it.
          # bank and hello did; gateway, workers, simulator and seeder are all
          # declared inside deploy/apps/tickets/, so they matched nothing and were
          # silently skipped — they sat at `newTag: latest` from the day they were
          # written. Argo CD saw no manifest change, so it never rolled them out,
          # and a "Synced/Healthy" app was running whatever :latest happened to be
          # when the pod last started. Grep for the image instead: wherever it is
          # declared is where it gets pinned.
          pin() {
            local image=$1 found=
            for k in deploy/apps/*/kustomization.yaml; do
              grep -q "name: $image\$" "$k" || continue
              (cd "$(dirname "$k")" && kustomize edit set image "$image:$SHA")
              echo "pinned $image -> $SHA  ($k)"
              found=yes
            done
            [ -n "$found" ] || echo "$image is not declared in any kustomization; image pushed, nothing to pin"
          }

          # Go services are whatever has a main package, built by the shared
          # Dockerfile at the repo root. Adding one needs no edit here.
          for dir in services/*/cmd; do
            svc=$(basename "$(dirname "$dir")")
            image=ghcr.io/$OWNER/tickets-$svc

            echo "::group::$svc"
            docker buildx build \
              --build-arg SERVICE="$svc" \
              --build-arg VERSION="$SHA" \
              --tag "$image:$SHA" \
              --tag "$image:latest" \
              --cache-from type=gha,scope=$svc \
              --cache-to   type=gha,scope=$svc,mode=max \
              --push .
            pin "$image"
            echo "::endgroup::"
          done

          # The frontend is the one image that is not a Go binary, so it has its
          # own Dockerfile and is built outside the loop rather than bent into it.
          echo "::group::web"
          image=ghcr.io/$OWNER/tickets-web
          docker buildx build \
            --file web/Dockerfile \
            --tag "$image:$SHA" \
            --tag "$image:latest" \
            --cache-from type=gha,scope=web \
            --cache-to   type=gha,scope=web,mode=max \
            --push .
          pin "$image"
          echo "::endgroup::"

      - name: Commit the pins
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/
          if git diff --staged --quiet; then
            echo "tags already current"
            exit 0
          fi
          git commit -m "deploy: $SHA [skip ci]" -m "$(git diff --staged --name-only)"
          # One job means one pusher — but only within a run. A FORCE-PUSH TO main
          # WHILE A BUILD IS IN FLIGHT breaks that: concurrency here queues rather
          # than cancels, so the old run and the new one both reach this step and
          # race. That happened on 2026-08-28 amending a commit message; the loser
          # failed here, and deploy/ was left pinned to a SHA that no longer
          # existed in history. The images were identical, so nothing was broken,
          # but the pin pointed at nothing you could look up.
          #
          # If that happens again: the images for the surviving SHA were still
          # pushed by the failed run, so re-pin to it rather than rebuilding.
          # Rebase once and try again covers the ordinary case, a human pushing.
          git push || { git pull --rebase origin main && git push; }
        env:
          SHA: ${{ github.sha }}
