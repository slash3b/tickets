# Build changed services, push to GitHub Container Registry, then write the new tag
# back into deploy/ so Argo CD picks it up.
#
# ghcr rather than Docker Hub: Actions injects GITHUB_TOKEN automatically, so there
# is no registry credential to create, rotate or leak. It also has no anonymous pull
# rate limit — Docker Hub throttles per IP, and three cluster nodes behind one NAT
# address is exactly the shape that trips it, surfacing as ImagePullBackOff with a
# toomanyrequests error at the worst possible moment.
#
# The tag bump is a real commit rather than Argo CD Image Updater, deliberately:
# every deploy becomes a visible line in git history, and "what is running" is
# answerable by reading the repo instead of querying the cluster.
name: build

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'pkg/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  # One build at a time: two concurrent runs would race on the tag-bump commit.
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    # A real Postgres, so the store tests actually run here instead of skipping.
    # The oversell test is NOT run in CI - it carries a build tag and is triggered
    # by hand with `make oversell`. It fires a thousand concurrent goroutines at a
    # database; that belongs in a decision to run it, not in every push.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tickets
          POSTGRES_PASSWORD: tickets
          POSTGRES_DB: tickets
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tickets"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://tickets:tickets@127.0.0.1:5432/tickets?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25', cache: true}
      - run: go vet ./...
      - run: go test -race -shuffle=on -timeout=2m ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed to push the tag-bump commit
      packages: write        # needed to push to ghcr.io
    strategy:
      matrix:
        # One entry per service. Adding a service means adding a line here.
        service: [hello, bank]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # built in; nothing to configure

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ github.sha }}
          tags: |
            ghcr.io/slash3b/tickets-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/slash3b/tickets-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bump the deployed tag
        run: |
          cd deploy/apps/${{ matrix.service }}
          curl -sSLo /tmp/kustomize.tar.gz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar -xzf /tmp/kustomize.tar.gz -C /tmp
          /tmp/kustomize edit set image \
            ghcr.io/slash3b/tickets-${{ matrix.service }}=ghcr.io/slash3b/tickets-${{ matrix.service }}:${{ github.sha }}

      - name: Commit the bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/
          # No change means the image tag was already current — not a failure.
          git diff --staged --quiet && echo "no tag change" && exit 0
          git commit -m "deploy(${{ matrix.service }}): ${{ github.sha }} [skip ci]"

          # RETRY WITH REBASE. Every service in the matrix finishes at roughly the
          # same time and each pushes its own tag bump, so all but one are rejected
          # non-fast-forward. Without this the losers fail silently-ish: the image
          # is built and pushed, but deploy/ still points at the old tag and the
          # service is simply never rolled out. That is exactly what happened to
          # bank on 2026-08-27 while hello succeeded.
          #
          # Each job edits a different file, so the rebase is always a clean merge.
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt) — rebasing onto origin/main"
            git pull --rebase origin main || exit 1
            sleep $((RANDOM % 4 + 1))
          done
          echo "could not push the tag bump after 5 attempts" >&2
          exit 1
