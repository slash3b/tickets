# The public API. The only service a browser reaches.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: tickets
  labels: {app: gateway}
spec:
  replicas: 1
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gateway
          image: ghcr.io/slash3b/tickets-gateway:latest   # CI rewrites this
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: PORT, value: "8080"}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "signoz-otel-collector.signoz.svc.cluster.local:4318"}
            # Pod identity from the downward API. These MUST be declared before
            # OTEL_RESOURCE_ATTRIBUTES below, because Kubernetes only expands
            # $(VAR) against variables defined earlier in this list — a later
            # definition silently expands to the literal string.
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            - name: NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
            - name: OTEL_RESOURCE_ATTRIBUTES
              # Read by obs.Setup via resource.WithFromEnv. This is what puts the
              # environment and the emitting pod on every span, without a line of
              # Go anywhere knowing that Kubernetes exists.
              value: "deployment.environment.name=homelab,k8s.cluster.name=homelab,k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME)"
            - {name: BANK_URL, value: "http://bank.bank.svc.cluster.local"}
            - {name: HOLD_TTL, value: "5m"}
            # Credentials come from the secret CloudNativePG generated. They are
            # never in git — see the README note about copying it into this
            # namespace, which is the one manual step here.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: tickets-pg-app, key: uri}
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits:   {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 10
          readinessProbe:
            # Readiness pings the database, so a gateway that cannot reach
            # Postgres leaves the rotation instead of serving 500s.
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: tickets
spec:
  selector: {app: gateway}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gateway
  namespace: tickets
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: tickets
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - api.tickets.lan
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - group: ""
          kind: Service
          name: gateway
          port: 80
          weight: 1
