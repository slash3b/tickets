# The load. Deliberately quiet by default — two arrivals a minute, most of them
# browsers who never buy.
#
# Exposed on a hostname so the dial is reachable without a redeploy:
#   curl -X PUT https://sim.tickets.lan/config -d '{"arrivals_per_minute":200,...}'
#   curl https://sim.tickets.lan/stats
# An on-sale is something you trigger, never a default.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator
  namespace: tickets
  labels: {app: simulator}
spec:
  replicas: 1          # THIS is the load dial for a real burst: scale it up
  selector:
    matchLabels: {app: simulator}
  template:
    metadata:
      labels: {app: simulator}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: simulator
          image: ghcr.io/slash3b/tickets-simulator:latest
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: PORT, value: "8080"}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "signoz-otel-collector.signoz.svc.cluster.local:4318"}
            # Pod identity from the downward API. These MUST be declared before
            # OTEL_RESOURCE_ATTRIBUTES below, because Kubernetes only expands
            # $(VAR) against variables defined earlier in this list — a later
            # definition silently expands to the literal string.
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            - name: NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
            - name: OTEL_RESOURCE_ATTRIBUTES
              # Read by obs.Setup via resource.WithFromEnv. This is what puts the
              # environment and the emitting pod on every span, without a line of
              # Go anywhere knowing that Kubernetes exists.
              value: "deployment.environment.name=homelab,k8s.cluster.name=homelab,k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME)"
            - {name: GATEWAY_URL, value: "http://gateway.tickets.svc.cluster.local"}
            - {name: ARRIVALS_PER_MINUTE, value: "2"}
          resources:
            # A burst holds one in-flight request per concurrent buyer. Bounded by
            # BURST_CONCURRENCY, but the ceiling still has to fit them.
            requests: {cpu: 10m, memory: 64Mi}
            limits:   {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: simulator
  namespace: tickets
spec:
  selector: {app: simulator}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: simulator
  namespace: tickets
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: tickets
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - sim.tickets.lan
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      # An on-sale rehearsal answers only when the last buyer is done, which is
      # minutes for a big one. Envoy's default route timeout is 15 SECONDS, and
      # the first 2000-buyer burst died on it exactly.
      timeouts:
        request: 900s
        backendRequest: 900s
      backendRefs:
        - group: ""
          kind: Service
          name: simulator
          port: 80
          weight: 1
