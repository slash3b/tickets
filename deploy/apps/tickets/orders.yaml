# The orders service: the saga.
#
# The only service that calls two others.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: tickets
  labels: {app: orders}
spec:
  replicas: 1
  selector:
    matchLabels: {app: orders}
  template:
    metadata:
      labels: {app: orders}
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: orders
          image: ghcr.io/slash3b/tickets-orders:latest   # CI rewrites this
          ports:
            - {name: http, containerPort: 8080}
            - {name: grpc, containerPort: 9090}
          env:
            - {name: PORT, value: "8080"}
            - {name: GRPC_PORT, value: "9090"}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "signoz-otel-collector.signoz.svc.cluster.local:4318"}
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            - name: NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment.name=homelab,k8s.cluster.name=homelab,k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME)"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: tickets-pg-app, key: uri}
            - {name: INVENTORY_ADDR, value: "inventory.tickets.svc.cluster.local:9090"}
            - {name: PAYMENTS_ADDR,  value: "payments.tickets.svc.cluster.local:9090"}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits:   {memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 10
          readinessProbe:
            # Readiness pings the database, so a service that cannot reach
            # Postgres leaves the rotation instead of failing every RPC.
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: tickets
spec:
  selector: {app: orders}
  ports:
    - {name: http, port: 80,   targetPort: http}
    - {name: grpc, port: 9090, targetPort: grpc}
