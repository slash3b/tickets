# One showing a day. This is what keeps the system permanently doing something
# real without anybody deciding to give it work.
#
# The standing rule for this project is one showing per day, quietly. An on-sale
# burst is something a human triggers through the simulator's /config dial, never
# something that happens on its own.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: seeder
  namespace: tickets
spec:
  # 03:00, so a fresh showing is on sale before anyone looks.
  schedule: "0 3 * * *"
  # If the cluster was down at 03:00, do not fire a backlog of runs at once.
  startingDeadlineSeconds: 3600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: seeder
              image: ghcr.io/slash3b/tickets-seeder:latest   # CI rewrites this
              env:
                - {name: CATALOG_ADDR,   value: "catalog.tickets.svc.cluster.local:9090"}
                - {name: INVENTORY_ADDR, value: "inventory.tickets.svc.cluster.local:9090"}
                # A CronJob is the one workload you cannot watch by eye — its pod
                # is gone by the time you wonder whether it ran. It reports like
                # everything else now.
                - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "signoz-otel-collector.signoz.svc.cluster.local:4318"}
                - name: POD_NAME
                  valueFrom:
                    fieldRef: {fieldPath: metadata.name}
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef: {fieldPath: metadata.namespace}
                - name: NODE_NAME
                  valueFrom:
                    fieldRef: {fieldPath: spec.nodeName}
                - name: OTEL_RESOURCE_ATTRIBUTES
                  value: "deployment.environment.name=homelab,k8s.cluster.name=homelab,k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME)"
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits:   {memory: 96Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
