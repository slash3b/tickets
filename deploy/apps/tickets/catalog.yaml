# The catalog service: what EXISTS.
#
# Read-mostly and the cheapest thing in the namespace. It has no HTTPRoute: it is
# not reachable from outside the cluster, and it should not be.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: tickets
  labels: {app: catalog}
spec:
  replicas: 1
  selector:
    matchLabels: {app: catalog}
  template:
    metadata:
      labels: {app: catalog}
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: catalog
          image: ghcr.io/slash3b/tickets-catalog:latest   # CI rewrites this
          ports:
            - {name: http, containerPort: 8080}
            - {name: grpc, containerPort: 9090}
          env:
            - {name: PORT, value: "8080"}
            - {name: GRPC_PORT, value: "9090"}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "signoz-otel-collector.signoz.svc.cluster.local:4318"}
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            - name: NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment.name=homelab,k8s.cluster.name=homelab,k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME)"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: tickets-pg-app, key: uri}
          resources:
            requests: {cpu: 10m, memory: 48Mi}
            limits:   {memory: 144Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 10
          readinessProbe:
            # Readiness pings the database, so a service that cannot reach
            # Postgres leaves the rotation instead of failing every RPC.
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: tickets
spec:
  selector: {app: catalog}
  ports:
    - {name: http, port: 80,   targetPort: http}
    - {name: grpc, port: 9090, targetPort: grpc}
