---
# workers is a SINGLETON and must never be evicted to be resized — two of it
# would run both sweepers and double the traffic to the bank. In-place handles
# that, and the updater's min-replicas backstop covers the case where it cannot.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: workers
  namespace: tickets
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: workers}
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
      - containerName: workers
        controlledResources: [memory]
        controlledValues: RequestsAndLimits
        minAllowed: {memory: 64Mi}
        maxAllowed: {memory: 384Mi}
---
# The simulator is deliberately NOT managed. Its memory is a function of how big
# a burst somebody decided to fire, not of steady behaviour — a recommender that
# averaged its idle weeks would shrink it straight back into the OOM that started
# all this, and then grow it again after the damage. BURST_CONCURRENCY is the
# right dial for that, and it is a human decision.
