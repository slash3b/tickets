# Right-sizing for the application services.
#
# WHY THIS EXISTS: every memory limit in this repo was a guess made when the
# biggest object in the system was a 96-seat cinema. The arena made all of them
# wrong simultaneously and the first on-sale OOMKilled the gateway and the
# simulator. Guessing again by hand would leave exactly the same trap for
# whatever comes after the arena.
#
# MODE IS InPlaceOrRecreate. Kubernetes 1.36 can change a running pod's resources
# without restarting it, so the usual reason to keep VPA in recommendation-only
# mode — that acting on a recommendation costs a restart — is gone. It falls back
# to recreate only where in-place is impossible.
#
# EVERY POLICY BOUNDS BOTH ENDS. An unbounded VPA will happily recommend
# something that cannot be scheduled on a 12G node, and will also shrink an idle
# service until its first burst OOMs it. minAllowed is set from what these
# actually use at rest; maxAllowed from what the node can spare.
#
# CPU IS DELIBERATELY LEFT ALONE (controlledResources: memory). These services
# are idle almost all the time and spike hard during an on-sale; a CPU
# recommendation built from that average would throttle exactly when it matters.
# Memory is the resource that actually killed things, so memory is what this
# manages.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: gateway
  namespace: tickets
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: gateway}
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
      - containerName: gateway
        controlledResources: [memory]
        controlledValues: RequestsAndLimits
        minAllowed: {memory: 96Mi}
        maxAllowed: {memory: 768Mi}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: catalog
  namespace: tickets
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: catalog}
