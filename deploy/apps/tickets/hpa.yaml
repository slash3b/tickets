apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: tickets
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: web}
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 80}}
---
# THERE IS DELIBERATELY NO HPA FOR workers, AND ADDING ONE WOULD BE A BUG.
#
# It runs the singletons: both inventory sweepers, the payment reconciler and the
# order resumer. Nothing there is unsafe concurrently, but N replicas do N times
# the work on the same rows and multiply traffic to the bank by N. It is pinned
# at one replica with strategy Recreate for the same reason — a rolling update
# would briefly run two.
#
# Nor for simulator: scaling the load generator multiplies the load, which is a
# thing to decide, not a thing to let a controller decide.
