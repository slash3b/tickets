# The fake bank. It is SUPPOSED to misbehave — that is its entire job.
#
# Exposed on a hostname so the chaos dial is reachable from a laptop:
#   curl -X PUT https://bank.tickets.lan/config -d '{"outage":true}'
# Watching the rest of the system react to that is the point of having it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank
  namespace: bank
  labels: {app: bank}
spec:
  # Kubernetes keeps TEN old ReplicaSets per Deployment by default. After a
  # day of frequent deploys this cluster had 139 of them sitting at zero —
  # harmless individually, but they are etcd objects and they bury the one
  # ReplicaSet that matters when you are reading `kubectl get rs` in a hurry.
  revisionHistoryLimit: 3
  replicas: 1          # making the antagonist highly available would be absurd
  selector:
    matchLabels: {app: bank}
  template:
    metadata:
      labels: {app: bank}
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: bank
          image: ghcr.io/slash3b/tickets-bank:latest   # CI rewrites this
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: PORT,  value: "8080"}
            - {name: DEBUG, value: "false"}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "signoz-otel-collector.signoz.svc.cluster.local:4318"}
            # Pod identity from the downward API. These MUST be declared before
            # OTEL_RESOURCE_ATTRIBUTES below, because Kubernetes only expands
            # $(VAR) against variables defined earlier in this list — a later
            # definition silently expands to the literal string.
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            - name: NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
            - name: OTEL_RESOURCE_ATTRIBUTES
              # Read by obs.Setup via resource.WithFromEnv. This is what puts the
              # environment and the emitting pod on every span, without a line of
              # Go anywhere knowing that Kubernetes exists.
              value: "deployment.environment.name=homelab,k8s.cluster.name=homelab,k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME)"
            # Tame defaults. Turn these savage deliberately, not by accident.
            - {name: DECLINE_RATE, value: "0.05"}
            - {name: TIMEOUT_RATE, value: "0.01"}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits:   {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: bank
  namespace: bank
spec:
  selector: {app: bank}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bank
  namespace: bank
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: tickets
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - bank.tickets.lan
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: bank
          port: 80
          weight: 1
---
# Lets the tickets namespace route to the bank.
#
# Gateway API refuses cross-namespace backendRefs by default, and that default is
# right: without it anyone could point a route at a service they do not own. The
# grant is the bank's side of the handshake, which is why it lives here rather
# than beside the route that needs it.
#
# Narrow on purpose: HTTPRoutes from `tickets` only, to Services only.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: tickets-to-bank
  namespace: bank
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: tickets
  to:
    - group: ""
      kind: Service
      name: bank
