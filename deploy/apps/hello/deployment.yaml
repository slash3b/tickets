apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: hello
  labels: {app: hello}
spec:
  replicas: 1
  selector:
    matchLabels: {app: hello}
  template:
    metadata:
      labels: {app: hello}
    spec:
      # 30s is plenty for a stateless HTTP service and keeps rollouts brisk.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: hello
          image: slash3b/tickets-hello:latest   # CI rewrites this via kustomize
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: PORT,  value: "8080"}
            - {name: DEBUG, value: "false"}
            # Empty until SigNoz exists in 0.6. obs.Setup treats an empty value as
            # "record spans, export nothing", so the service runs either way.
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: ""}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits:   {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: hello
  namespace: hello
spec:
  selector: {app: hello}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello
  namespace: hello
  annotations:
    cert-manager.io/cluster-issuer: tickets-lan-ca
spec:
  ingressClassName: nginx
  tls:
    - hosts: [hello.tickets.lan]
      secretName: hello-tls
  rules:
    - host: hello.tickets.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello
                port: {name: http}
