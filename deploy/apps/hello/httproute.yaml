# hello behind the Gateway. Note there is no TLS block and no certificate here —
# the Gateway holds one wildcard cert for *.tickets.lan, so adding a service no
# longer involves certificates at all. Under Ingress each host needed its own.
# NOTE: group/kind/weight below are the API's own defaults, written out explicitly.
# Kubernetes fills them in on write, so leaving them off makes Argo CD diff the
# manifest against a live object that has them — permanently OutOfSync, which
# destroys OutOfSync as a signal. Being explicit is cheaper than an ignore rule
# and documents what the route actually attaches to.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello
  namespace: hello
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: tickets
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - hello.tickets.lan
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: hello
          port: 80
          weight: 1
