# SigNoz UI behind the Gateway. The chart's own ingress is disabled in
# deploy/platform/signoz/values.yaml; routing lives here instead so every route in
# the cluster is described the same way.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: signoz
  namespace: signoz
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  parentRefs:
    - name: tickets
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - signoz.tickets.lan
  rules:
    - backendRefs:
        - name: signoz
          port: 8080
