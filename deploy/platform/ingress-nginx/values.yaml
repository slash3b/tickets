# ingress-nginx 4.15.1 — one entry point for every hostname in the cluster.
#
# Replaces NodePort sprawl: instead of remembering that Argo CD is :31439 and the
# next service is some other random port, everything is https://<name>.tickets.lan
# behind a single LoadBalancer IP.
controller:
  replicaCount: 1          # single homelab entry point; raise to 2 once anything
                           # depends on this surviving a node reboot

  service:
    type: LoadBalancer
    annotations:
      # Pin the address rather than letting MetalLB pick from the pool. The IP ends
      # up in /etc/hosts on every machine that talks to the cluster, so it must not
      # move when the service is recreated.
      metallb.universe.tf/loadBalancerIPs: "192.168.1.240"

  ingressClassResource:
    name: nginx
    enabled: true
    default: true          # an Ingress without ingressClassName still works

  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits:   {memory: 384Mi}

  # Surface controller metrics so SigNoz can scrape them in 0.6.
  metrics:
    enabled: true

  config:
    # Real client IPs in logs and traces rather than the pod network's address.
    use-forwarded-headers: "true"
    enable-real-ip: "true"

  admissionWebhooks:
    enabled: true
