# k8s-infra — the DaemonSet half of SigNoz.
#
# The signoz chart gives you the store, the UI and an OTLP endpoint. It does NOT
# collect anything by itself. This is what tails container logs off each node and
# scrapes node/pod/cluster metrics, which is what makes the infrastructure half of
# the Datadog picture appear at all.
#
# Without it, applications that push OTLP still get traces and metrics — but their
# LOG LINES never reach the store, so trace-to-log correlation silently does not
# work. Two of three signals, with nothing obviously broken.

clusterName: homelab

# FULL URL WITH SCHEME, AND PORT 4318 — and note this is the exact OPPOSITE of what
# pkg/obs needs, which is host:port with no scheme.
#
# The Go SDK's otlptracehttp.WithEndpoint takes host:port and REJECTS a scheme.
# The Collector's otlphttp exporter takes a URL and REQUIRES one. Same protocol,
# inverted conventions, and getting it wrong fails as:
#   unsupported protocol scheme "signoz-otel-collector.signoz.svc.cluster.local"
#
# 4318 is HTTP; 4317 is gRPC. This agent's exporter is otlphttp, so 4317 would be
# wrong even with a scheme — it would speak HTTP at a gRPC listener.
otelCollectorEndpoint: http://signoz-otel-collector.signoz.svc.cluster.local:4318
otelInsecure: true

presets:
  logsCollection:
    enabled: true
  hostMetrics:
    enabled: true
  kubeletMetrics:
    enabled: true
  clusterMetrics:
    enabled: true
  otlpExporter:
    enabled: true

otelAgent:
  # DaemonSet: one per node, including the control plane, so nothing is a blind
  # spot. Tolerations matter here even though the control plane is untainted —
  # if it is ever re-tainted, losing telemetry from it should not be the way you
  # find out.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits:   {memory: 384Mi}

otelDeployment:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits:   {memory: 384Mi}
