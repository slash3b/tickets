# k8s-infra — the DaemonSet half of SigNoz.
#
# The signoz chart gives you the store, the UI and an OTLP endpoint. It does NOT
# collect anything by itself. This is what tails container logs off each node and
# scrapes node/pod/cluster metrics, which is what makes the infrastructure half of
# the Datadog picture appear at all.
#
# Without it, applications that push OTLP still get traces and metrics — but their
# LOG LINES never reach the store, so trace-to-log correlation silently does not
# work. Two of three signals, with nothing obviously broken.

clusterName: homelab

# FULL URL WITH SCHEME, AND PORT 4318 — and note this is the exact OPPOSITE of what
# pkg/obs needs, which is host:port with no scheme.
#
# The Go SDK's otlptracehttp.WithEndpoint takes host:port and REJECTS a scheme.
# The Collector's otlphttp exporter takes a URL and REQUIRES one. Same protocol,
# inverted conventions, and getting it wrong fails as:
#   unsupported protocol scheme "signoz-otel-collector.signoz.svc.cluster.local"
#
# 4318 is HTTP; 4317 is gRPC. This agent's exporter is otlphttp, so 4317 would be
# wrong even with a scheme — it would speak HTTP at a gRPC listener.
otelCollectorEndpoint: http://signoz-otel-collector.signoz.svc.cluster.local:4318
otelInsecure: true

presets:
  logsCollection:
    enabled: true

    # STOPS A FEEDBACK LOOP THAT NEARLY TOOK THE CLUSTER DOWN.
    #
    # ClickHouse logs every query it runs. The agent collected those logs and
    # INSERTed them into ClickHouse, which logged the insert, which was collected
    # again. Measured at ~20,000 records/minute on a completely idle cluster -
    # 41,912 of 42,000 in a two-minute sample came from the clickhouse container
    # alone - with ClickHouse pinned near its 4Gi limit and burning three CPU
    # cores doing nothing but ingesting its own chatter.
    #
    # The chart's blacklist.signozLogs is already true and does NOT catch this:
    # the ClickHouse pods are created by the clickhouse-operator from a
    # ClickHouseInstallation CR, not by the Helm release, so they never carry the
    # labels that filter matches on. Excluding the container by name is what works.
    #
    # The collector and the agent stay collected - they are small, and their logs
    # are how you debug the pipeline itself.
    # EVERY OTLP-PUSHING SERVICE IS EXCLUDED HERE, AND THAT IS NOT A GAP.
    #
    # pkg/logger tees each line to stdout AND to OTLP on purpose: stdout so
    # `kubectl logs` works when the telemetry pipeline is down, OTLP so the line
    # lands beside its trace. This agent tails stdout, so leaving these in stored
    # BOTH copies of every line - measured at 8,003 filelog records against 2,828
    # OTLP records in thirty minutes, with catalog, inventory, orders, payments,
    # simulator and seeder matching their OTLP counts exactly.
    #
    # THE TWO COPIES ARE NOT EQUALLY GOOD. The OTLP record carries trace_id,
    # span_id, severity and customer_id as real indexed fields. The filelog copy
    # is the raw zap JSON in the body with NOTHING parsed out - trace_id empty on
    # all 8,003 of them - so it cannot be correlated, only grepped. Keeping the
    # correlated copy and dropping the blob is the whole decision.
    #
    # WHAT THIS COSTS: a panic goes to stderr and the SDK never gets to flush it,
    # so a crash message no longer reaches SigNoz. It is still in the pod:
    #   kubectl -n tickets logs <pod> --previous
    # and the restart itself is visible in kubeletMetrics. That is the trade -
    # accepted because a crash is a thing you already go to the pod for, while
    # correlation is a thing you need a thousand times a day.
    #
    # web IS NOT LISTED. It is nginx, it has no SDK, and this agent is the only
    # way its access logs are collected at all.
    #
    # MATCHING IS BY CONTAINER NAME AND IS NOT NAMESPACED, so these names must
    # stay unique across the cluster. Checked when this was written: each of them
    # appears in exactly one namespace.
    blacklist:
      enabled: true
      signozLogs: true
      namespaces:
        - kube-system
      containers:
        - clickhouse
        - bank
        - catalog
        - gateway
        - inventory
        - orders
        - payments
        - seeder
        - simulator
        - workers
        # Inert and loud. argocd-notifications-cm is EMPTY - nothing is
        # configured to notify anything - and the controller still wrote 2,550
        # lines an hour, more than every tickets service combined. The
        # application-controller and repo-server stay collected: those are what
        # you read when a sync fails.
        - argocd-notifications-controller
  hostMetrics:
    enabled: true
  kubeletMetrics:
    enabled: true
  clusterMetrics:
    enabled: true
  otlpExporter:
    enabled: true

otelAgent:
  # DaemonSet: one per node, including the control plane, so nothing is a blind
  # spot. Tolerations matter here even though the control plane is untainted —
  # if it is ever re-tainted, losing telemetry from it should not be the way you
  # find out.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits:   {memory: 384Mi}

otelDeployment:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits:   {memory: 384Mi}
