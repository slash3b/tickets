# Argo CD behind a hostname instead of NodePort 31439.
#
# backend-protocol HTTPS is required: argocd-server terminates TLS itself with its
# own self-signed cert, so nginx must speak HTTPS upstream rather than plaintext.
# The alternative is running argocd-server with --insecure and terminating only at
# the ingress; this way keeps the hop encrypted end to end.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd
  namespace: argocd
  annotations:
    cert-manager.io/cluster-issuer: tickets-lan-ca
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [argocd.tickets.lan]
      secretName: argocd-tls
  rules:
    - host: argocd.tickets.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 443
