# Argo CD behind the Gateway.
#
# Replaces the Ingress that used nginx's backend-protocol: HTTPS annotation to speak
# TLS upstream. Gateway API has no annotation for that — upstream TLS is a
# BackendTLSPolicy, which needs argocd-server's self-signed CA wired in. The
# conventional answer behind a TLS-terminating proxy is simpler: run argocd-server
# with server.insecure=true and let the Gateway own TLS. The hop is inside the pod
# network and never leaves the node.
#
# That flag is set in cm/argocd-cmd-params-cm — see GITOPS in infra/CLUSTER.md.
# NOTE: group/kind/weight below are the API's own defaults, written out explicitly.
# Kubernetes fills them in on write, so leaving them off makes Argo CD diff the
# manifest against a live object that has them — permanently OutOfSync, which
# destroys OutOfSync as a signal. Being explicit is cheaper than an ignore rule
# and documents what the route actually attaches to.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: tickets
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - argocd.tickets.lan
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: argocd-server
          port: 80
          weight: 1
