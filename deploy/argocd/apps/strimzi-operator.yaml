# Strimzi operator. Wave 1: supplies the kafka.strimzi.io CRDs that the Kafka
# cluster in wave 4 depends on.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://strimzi.io/charts/
      chart: strimzi-kafka-operator
      targetRevision: 1.2.0
      helm:
        valueFiles:
          - $values/deploy/platform/strimzi/values.yaml
    - repoURL: https://github.com/slash3b/tickets.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: strimzi-system
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - '.spec.template.spec.containers[].env[].valueFrom.resourceFieldRef.divisor'
    # The chart declares an EMPTY `properties: {}` on one schema node of the Kafka
    # CRD. Kubernetes drops empty maps when persisting a CRD schema, so the live
    # object can never contain it and Argo diffs on it forever — leaving the app
    # permanently OutOfSync, which destroys OutOfSync as a signal for real drift.
    #
    # Found by diffing Argo's own normalizedLiveState against predictedLiveState via
    # /api/v1/applications/strimzi-operator/managed-resources. Diffing the rendered
    # chart against the live object points at the wrong fields, because it skips the
    # normalizers Argo applies first.
    #
    # Revisit on chart upgrades: if upstream stops emitting the empty map, delete
    # this rather than leaving it to mask something real later.
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: kafkas.kafka.strimzi.io
      jqPathExpressions:
        - '.spec.versions[].schema.openAPIV3Schema.properties.status.properties.clusterSecurity.properties'
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
