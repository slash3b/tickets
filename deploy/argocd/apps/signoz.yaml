# SigNoz. Wave 5: after the access layer and the cert-manager issuer, since its UI
# ingress needs both.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: signoz
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://charts.signoz.io
      chart: signoz
      targetRevision: 0.138.0
      helm:
        valueFiles:
          - $values/deploy/platform/signoz/values.yaml
    - repoURL: https://github.com/slash3b/tickets.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: signoz

  # WHY THIS EXISTS. Three resources are permanently OutOfSync because the API
  # server populates fields that the rendered chart does not contain. These are
  # server-side defaults, not drift — the live object can never match, so Argo
  # applies successfully, re-detects the difference, burns its five self-heal
  # retries and parks at OutOfSync forever.
  #
  # That is not cosmetic. While it stands, OutOfSync carries no information, so
  # genuine drift on this app would be invisible.
  #
  #   StatefulSet/signoz, StatefulSet/signoz-zookeeper
  #     .spec.volumeClaimTemplates[].apiVersion  and  .kind
  #     Kubernetes stamps apiVersion: v1 / kind: PersistentVolumeClaim onto each
  #     volumeClaimTemplate. Charts never render them. This is the single most
  #     common permanent-OutOfSync cause for any StatefulSet with storage.
  #
  #   Deployment/signoz-clickhouse-operator
  #     .spec.template.spec.containers[].env[].valueFrom.resourceFieldRef.divisor
  #     Defaults to "0" server-side whenever env is sourced from resource limits.
  #
  # Determined by reading Argo's OWN comparison via
  #   GET /api/v1/applications/signoz/managed-resources
  # and diffing normalizedLiveState against predictedLiveState. Diffing `helm
  # template` output against the live object instead points at the wrong fields,
  # because it skips the normalizers Argo applies first.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - '.spec.volumeClaimTemplates[].apiVersion'
        - '.spec.volumeClaimTemplates[].kind'
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - '.spec.template.spec.containers[].env[].valueFrom.resourceFieldRef.divisor'

  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      # ServerSideApply also matters because the chart ships ClickHouse operator
      # CRDs large enough to exceed the 262144-byte annotation limit that
      # client-side apply writes — the same trap the Argo CD 3.x upgrade hit.
      - ServerSideApply=true
      # WITHOUT THIS THE APP IS PERMANENTLY OutOfSync. The chart renders explicit
      # empty strings — priorityClassName: "" and an env var with value: "" — and
      # those fields are omitempty in Kubernetes' Go structs, so the API server
      # drops them on write. Desired has them, live never will, and Argo re-syncs
      # forever, which also destroys OutOfSync as a signal: real drift becomes
      # indistinguishable from this noise.
      #
      # ServerSideDiff compares against a server-side apply DRY RUN, so it sees
      # what the server would actually store rather than what the chart emitted.
      # Better than ignoreDifferences path-by-path, which would need brittle
      # container/env array indices.
      # Sync must also skip the ignored fields, or it re-applies them and
      # re-creates the drift the diff just ignored.
      - RespectIgnoreDifferences=true
    # ClickHouse and its operator take a while to converge on first install.
    # NOTE: retry belongs under syncPolicy, NOT at spec level. Putting it at
    # spec.retry makes it an unknown field that the API server silently drops, so
    # git keeps saying it exists and the parent app diffs against that forever.
    retry:
      limit: 5
      backoff: {duration: 30s, factor: 2, maxDuration: 5m}
