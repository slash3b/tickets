# SigNoz. Wave 5: after the access layer and the cert-manager issuer, since its UI
# ingress needs both.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: signoz
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://charts.signoz.io
      chart: signoz
      targetRevision: 0.138.0
      helm:
        valueFiles:
          - $values/deploy/platform/signoz/values.yaml
    - repoURL: https://github.com/slash3b/tickets.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: signoz

  # WHY THIS EXISTS. The SigNoz chart renders three fields as explicit empty
  # strings. Those fields are `omitempty` in Kubernetes' Go structs, so the API
  # server drops them on write and the live object can NEVER contain them. Argo
  # therefore sees permanent drift, self-heals in a loop, burns its five retries
  # and parks the app at OutOfSync forever:
  #
  #   Deployment/signoz-clickhouse-operator   .spec.template.spec.priorityClassName
  #   StatefulSet/signoz                      .spec.template.spec.priorityClassName
  #   StatefulSet/signoz-zookeeper            env ZOO_DATA_LOG_DIR .value
  #
  # The damage is not cosmetic: while this is unresolved, OutOfSync means nothing,
  # so REAL drift is invisible. ServerSideDiff was tried first and did not settle
  # it, so these are ignored explicitly. jqPathExpressions rather than jsonPointers
  # because the env entry would otherwise need a brittle array index.
  #
  # Revisit on chart upgrades — if upstream stops emitting empty strings, delete
  # this block rather than leaving it to mask something real later.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - '.spec.template.spec.priorityClassName'
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - '.spec.template.spec.priorityClassName'
        - '.spec.template.spec.containers[].env[] | select(.name == "ZOO_DATA_LOG_DIR").value'
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      # ServerSideApply also matters because the chart ships ClickHouse operator
      # CRDs large enough to exceed the 262144-byte annotation limit that
      # client-side apply writes — the same trap the Argo CD 3.x upgrade hit.
      - ServerSideApply=true
      # WITHOUT THIS THE APP IS PERMANENTLY OutOfSync. The chart renders explicit
      # empty strings — priorityClassName: "" and an env var with value: "" — and
      # those fields are omitempty in Kubernetes' Go structs, so the API server
      # drops them on write. Desired has them, live never will, and Argo re-syncs
      # forever, which also destroys OutOfSync as a signal: real drift becomes
      # indistinguishable from this noise.
      #
      # ServerSideDiff compares against a server-side apply DRY RUN, so it sees
      # what the server would actually store rather than what the chart emitted.
      # Better than ignoreDifferences path-by-path, which would need brittle
      # container/env array indices.
      - ServerSideDiff=true
      # Without this, sync still APPLIES the ignored fields even though the diff
      # ignores them — which re-creates the drift on every sync.
      - RespectIgnoreDifferences=true
    # ClickHouse and its operator take a while to converge on first install.
    # NOTE: retry belongs under syncPolicy, NOT at spec level. Putting it at
    # spec.retry makes it an unknown field that the API server silently drops, so
    # git keeps saying it exists and the parent app diffs against that forever.
    retry:
      limit: 5
      backoff: {duration: 30s, factor: 2, maxDuration: 5m}
