# Static file serving ONLY. There is deliberately no proxy_pass here.
#
# The obvious first design was to proxy /api from this pod to the gateway Service,
# so the browser sees one origin. It works, but it puts an L7 router inside a pod
# that already sits behind an L7 router, and it drags in nginx's worst trait: a
# literal hostname in proxy_pass is resolved ONCE, at startup, so this pod would
# refuse to start whenever the gateway Service was absent and would hold a dead
# ClusterIP if the Service were recreated.
#
# Same-origin is achieved one layer up instead: the HTTPRoute for tickets.lan has
# two rules, /api to the gateway and / to here. The Gateway was always going to be
# in the path — routing there costs nothing and deletes a hop, a config template,
# and a whole class of DNS failure.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # SPA fallback: any path that is not a real file is the app's own routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints these filenames, so they can never go stale.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must NOT be cached, or a browser keeps loading the old bundle
    # names after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # NOTE: /api never reaches this server — the HTTPRoute sends it to the
    # gateway before nginx sees it. That matters for the seat-map SSE stream: if
    # anyone ever puts /api back behind this nginx, proxy_buffering must be off
    # or the stream is held in a buffer and arrives in useless clumps.

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }
}
